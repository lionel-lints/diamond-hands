name: tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Locked deps; network tests stay deselected (pytest.ini), integration tests run on the
      # committed data/ folder with the fictional example profile.
      - run: uv run python -m pytest
